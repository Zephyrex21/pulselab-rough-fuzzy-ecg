name: MIT-BIH patient-disjoint training

on:
  workflow_dispatch:

# Manual, read-only training run. The workflow publishes a downloadable
# workflow artifact and does not write generated models back into Git.
permissions:
  contents: read

concurrency:
  group: mitbih-patient-disjoint-training
  cancel-in-progress: false

jobs:
  train:
    name: Train and package MIT-BIH models
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned training Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.18"
          cache: pip
          cache-dependency-path: requirements/mitbih-model-runtime.txt

      - name: Install exact model runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/mitbih-model-runtime.txt

      - name: Set reproducible run name
        id: run
        shell: bash
        run: |
          echo "run_name=pulselab_patient_disjoint_adaptive_$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download and train on the complete patient-disjoint split
        env:
          RUN_NAME: ${{ steps.run.outputs.run_name }}
        run: |
          python train.py \
            --download \
            --data-dir data/mitdb \
            --output-dir experiments \
            --run-name "$RUN_NAME" \
            --split-protocol patient-disjoint \
            --peak-source detected

      - name: Validate and package trained models
        env:
          RUN_NAME: ${{ steps.run.outputs.run_name }}
        run: |
          python -m tools.package_mitbih_run \
            --run-id "$RUN_NAME" \
            --project-root . \
            --output-dir dist

      - name: Upload verified bundle and run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulselab-mitbih-${{ steps.run.outputs.run_name }}
          path: |
            dist/PulseLab_MITBIH_${{ steps.run.outputs.run_name }}.zip
            experiments/${{ steps.run.outputs.run_name }}/
            models/${{ steps.run.outputs.run_name }}/
          if-no-files-found: warn
          retention-days: 60
