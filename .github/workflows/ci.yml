name: PulseLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository and runs tests. It does not publish,
# deploy, upload artifacts, or write back to GitHub.
permissions:
  contents: read

concurrency:
  group: pulselab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (3.10–3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q app.py server.py config.py train.py audit_dataset.py validate_rpeaks.py modules tests

      - name: Run Python test suite
        run: python -m pytest -q

  browser-smoke-tests:
    name: Browser JavaScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/core.js

      - name: Run browser-core smoke test
        run: node tests/browser_core_smoke.test.js
